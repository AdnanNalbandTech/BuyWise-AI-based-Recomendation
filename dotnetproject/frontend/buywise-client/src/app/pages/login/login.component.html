<section class="auth-page">
  <div class="auth-visual">
    <div class="visual-content">
      <span class="eyebrow">BUYWISE marketplace</span>
      <h1>Shop smarter with AI-guided product picks.</h1>
      <p>Browse categories, compare details, and let BUYWISE surface related products while your basket grows.</p>
    </div>
  </div>

  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="section-title">
      <h2>Login</h2>
      <p>Use the seeded admin account or register as a new customer.</p>
    </div>

    <p *ngIf="error" class="notice error">{{ error }}</p>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email">
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password">
    </label>

    <button class="button" type="submit" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Sign in' }}
    </button>

    <p class="switch-link">
      New to BUYWISE?
      <a routerLink="/register">Create an account</a>
    </p>
  </form>
</section>
